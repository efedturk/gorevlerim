<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#6750a4" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Görevlerim" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="style.css" />
    <title>Görevlerim</title>
  </head>
  <body>
    <main class="app-shell">
      <header>
        <p class="eyebrow">GÜNLÜK PLANLAYICI</p>
        <div class="heading-row">
          <div>
            <h1>Görevlerim</h1>
            <p id="summary">Bugün için harika bir plan yap.</p>
          </div>
          <button id="theme-button" class="icon-button" aria-label="Tema değiştir">◐</button>
        </div>
      </header>

      <section class="new-task card" aria-label="Yeni görev ekle">
        <label for="task-title">Yeni görev</label>
        <input id="task-title" type="text" maxlength="100" placeholder="Örn. Proje sunumunu hazırla" />
        <div class="task-options">
          <select id="task-priority" aria-label="Öncelik">
            <option value="low">Düşük öncelik</option>
            <option value="medium" selected>Orta öncelik</option>
            <option value="high">Yüksek öncelik</option>
          </select>
          <input id="task-date" type="date" aria-label="Son tarih" />
          <button id="add-button" class="primary-button">Ekle</button>
        </div>
      </section>

      <nav class="filters" aria-label="Görev filtreleri">
        <button class="filter active" data-filter="all">Tümü</button>
        <button class="filter" data-filter="active">Yapılacak</button>
        <button class="filter" data-filter="completed">Tamamlanan</button>
      </nav>

      <section aria-live="polite">
        <ul id="task-list" class="task-list"></ul>
        <div id="empty-state" class="empty-state card" hidden>
          <span>✓</span>
          <h2>Burada henüz görev yok</h2>
          <p>İlk görevini yukarıdan ekleyerek başlayabilirsin.</p>
        </div>
      </section>

      <footer>
        <button id="clear-completed" class="text-button">Tamamlananları temizle</button>
      </footer>
    </main>
    <script src="app.js"></script>
  </body>
</html>
